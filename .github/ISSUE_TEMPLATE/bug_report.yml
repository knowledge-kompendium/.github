name: Bug report
description: Something behaves differently from what the specification or documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior, with input content or a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Cite the specification section or documentation if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or commit.
